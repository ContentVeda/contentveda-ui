name: Playwright Tests
# The branch filters match the *base* of a pull request, not its head. Without
# beta here, the feat/fix -> beta half of the promotion flow ran no checks at
# all: a PR into beta matched neither filter, and only the later beta -> main PR
# was tested. That is the wrong end to find out at, since beta is where changes
# land first.
#
# release/* is included so a release branch is checked on the way in and on the
# way out. It is a merge source, not a publishing branch: nothing in
# release.config.js matches it, so pushing one publishes nothing -- it is
# somewhere to assemble a release before promoting it into beta or main.
on:
  push:
    branches: [ main, master, beta, 'release/*' ]
  pull_request:
    branches: [ main, master, beta, 'release/*' ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
