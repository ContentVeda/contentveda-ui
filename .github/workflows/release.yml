name: Release

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate on the suite before anything is published. semantic-release runs
  # prepublishOnly, which only builds — so without this a commit that compiles
  # but fails its tests goes to npm, and npm versions cannot be taken back.
  #
  # This duplicates what playwright.yml already runs on the same push, and that
  # is deliberate: that workflow is a separate run with no ordering relationship
  # to this one, so depending on it would mean publishing while it is still
  # going. A job in this workflow is the only thing `needs` can actually wait
  # for.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library and generate docs pages
        run: npm run build

      # test:bdd runs `playwright install chromium` itself, but deliberately
      # without --with-deps: that flag apt-installs system libraries and needs
      # root, which is right for a runner and wrong for a contributor running
      # the suite locally. So the OS-level half is done here instead, matching
      # playwright.yml, and the npm script's own install becomes a fast no-op.
      #
      # Nothing has failed on this yet -- chromium currently launches on
      # ubuntu-latest without it. But that is a property of the runner image,
      # not a guarantee, and it is the image that changes underneath a pinned
      # Playwright version. Being the only workflow missing it made this a
      # standing suspect while triaging a failure it turned out not to cause.
      - name: Install Playwright browsers with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run BDD suite
        run: npm run test:bdd

      # When the gate above trips, this is the only durable record of *why*.
      # The run log itself is not enough: downloading it via the API needs
      # repo-admin rights, so anyone triaging without them sees a failed step
      # and no reason. cucumber.cjs already writes one JSON blob per scenario
      # to tests/bdd/.allure-results carrying its status and, on failure, the
      # assertion message -- it just died with the runner. Keeping it turns
      # "verify failed" into a named scenario.
      #
      # `!cancelled()` rather than `failure()` deliberately: runs 13 and 14
      # were the same commit, one green and one red, which is the signature of
      # a flake rather than a regression. Diffing those two only works if the
      # passing run left its results behind too.
      - name: Upload BDD results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-allure-results
          path: tests/bdd/.allure-results
          retention-days: 30

  # There is no CodeQL gate here, on purpose.
  #
  # One used to wait for the "Analyze (...)" checks before publishing, on the
  # reasoning that an npm version cannot be taken back so the publish must not
  # beat its own scan. GitHub already guarantees that for main, and more firmly:
  # the branch ruleset carries both a pull_request rule, so nothing reaches main
  # except through a pull request, and a code_scanning rule set to CodeQL at
  # high_or_higher / errors, which blocks the *merge*. A commit cannot arrive on
  # main without having been scanned and cleared first, so by the time this
  # workflow runs the answer is already in.
  #
  # Re-checking it cost two failed releases. Superseded analyses report
  # "cancelled" and were read as failures, blocking 0.0.2 on a commit CodeQL had
  # scanned clean; and beta is not scanned at all -- default setup covers the
  # default branch and pull requests aimed at it, nothing else -- so every beta
  # push sat out the full timeout and failed. Both were faults in the gate
  # rather than in the code it was gating.
  #
  # beta publishes ahead of any analysis, which is the trade a prerelease
  # channel makes. The same code is scanned on the pull request promoting it,
  # before anything reaches @latest.
  release:
    needs: verify
    runs-on: ubuntu-latest
    # Scopes the OIDC token's environment claim to "release", matching the
    # Trusted Publisher configured on npmjs.com for this package — npm checks
    # that claim, so the environment name must match exactly (and the
    # environment itself must exist under repo Settings -> Environments).
    environment: release
    permissions:
      contents: write      # semantic-release commits CHANGELOG/package.json bump + creates the git tag
      issues: write        # @semantic-release/github comments on referenced issues/PRs
      pull-requests: write
      id-token: write      # OIDC for npm trusted publishing (also covers provenance)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history to analyze commits since the last tag
          persist-credentials: false

      # Deliberately no `registry-url`. It looks like the setting that tells npm
      # where to publish; what it actually does is write an .npmrc containing
      #
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #   always-auth=true
      #
      # and point NPM_CONFIG_USERCONFIG at it. @semantic-release/npm then sees a
      # token configured, takes verifyTokenAuth instead of the OIDC exchange,
      # resolves that placeholder to an empty string and fails with
      # EINVALIDNPMTOKEN — which is why dropping the NPM_TOKEN env var alone did
      # not fix it: the token path was being chosen by the npmrc, not by the
      # variable. The `npm warn Unknown user config "always-auth"` at the top of
      # those failing logs is this file being written.
      #
      # The registry is already in package.json (publishConfig) and is npm's
      # default anyway, so nothing is lost by leaving this out.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TEMPORARY — remove once the trusted-publisher mismatch is identified.
      #
      # semantic-release reports this failure as ENONPMTOKEN ("No npm token
      # specified"), which is misleading: that error comes from set-npmrc-auth,
      # the *fallback* path taken only after verify-auth.js has already tried
      # OIDC and got nothing back. The real reason is a log line above it, and
      # neither branch of it says what npm actually objected to.
      #
      # So do the two steps npm does, by hand. First print the claims npm
      # compares against the Trusted Publisher config, then perform the token
      # exchange ourselves and print only its status and message.
      #
      # Note what is *not* printed: the id_token and the exchanged publish
      # credential are both real credentials. Only the decoded claim set and
      # the error message ever reach the log.
      - name: Debug OIDC claims and token exchange
        run: |
          RESP=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")

          TOKEN=$(node -e '
            const r = JSON.parse(process.argv[1]);
            if (!r.value) {
              console.error("No id_token returned:", JSON.stringify(r));
              process.exit(1);
            }
            const c = JSON.parse(Buffer.from(r.value.split(".")[1], "base64url"));
            console.error("--- OIDC claims npm will match against ---");
            console.error(JSON.stringify({
              repository: c.repository,
              repository_owner: c.repository_owner,
              workflow_ref: c.workflow_ref,
              job_workflow_ref: c.job_workflow_ref,
              environment: c.environment,
              aud: c.aud,
            }, null, 2));
            process.stdout.write(r.value);
          ' "$RESP")

          echo "--- npm token exchange for $(node -p "require('./package.json').name") ---"
          PKG=$(node -p "encodeURIComponent(require('./package.json').name)")
          curl -sS -o body.json -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG"
          node -e '
            const b = require("./body.json");
            console.log(b.token ? "exchange SUCCEEDED (token withheld)" : JSON.stringify(b, null, 2));
          '
          rm -f body.json

      # No NPM_TOKEN/NODE_AUTH_TOKEN needed anymore — @semantic-release/npm
      # (v13.1.5+) detects the GitHub Actions OIDC context automatically and
      # exchanges it for a short-lived publish credential via npm's Trusted
      # Publisher flow, which also generates provenance attestations without
      # needing NPM_CONFIG_PROVENANCE explicitly set.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN here, and that is load-bearing rather than an omission.
          #
          # @semantic-release/npm picks its auth path by whether NPM_TOKEN is
          # *present*, not whether it is usable. `NPM_TOKEN: ${{ secrets.X }}`
          # with the secret unset still exports an empty string, which is enough
          # to send it down verifyTokenAuth instead of the OIDC exchange — and
          # it then fails with EINVALIDNPMTOKEN in verifyConditions, before a
          # version is ever computed. So the variable must be absent, not empty.
          #
          # 0.0.1 was published from a local machine to bootstrap the package,
          # because trusted publishing is configured on a package's own settings
          # page and cannot exist for a name that has never been published. With
          # that configured (repository ContentVeda/contentveda-ui, workflow
          # release.yml, environment release), OIDC now covers every release —
          # and generates provenance attestations without NPM_CONFIG_PROVENANCE
          # being set, since id-token: write is granted above.
        run: npx semantic-release

      # Writes the released version back into package.json/package-lock.json.
      #
      # @semantic-release/git would normally do this as part of the release, and
      # is deliberately not in the plugin list: it pushes straight to the
      # release branch, and main's ruleset rejects that (see release.config.js).
      # Doing it here instead means the push is ours, so it can take the route
      # each branch actually allows.
      #
      # Worth knowing this is cosmetic. The published tarball already carries
      # the right version -- semantic-release sets it before packing -- and
      # nothing in the build reads this field for correctness any more, since
      # generate-docs.js resolves the version from the tag. This keeps the
      # checked-in tree honest about what shipped; it does not make anything
      # work that was broken.
      #
      # The tag is the source of truth, not semantic-release's stdout: it is
      # created on this commit through the GitHub API, so it has to be fetched
      # back before it is visible locally. No tag on HEAD means nothing was
      # released -- a run over commits that contain no feat/fix, or a re-run of
      # a commit already published -- and there is nothing to record.
      #
      # Only main records, and beta deliberately never does. If both wrote their
      # own number, they would be editing the same package.json line from a
      # common ancestor and every back-merge would collide on it -- and the two
      # branches still could not agree, since beta is by definition ahead. Held
      # to main's stable version the field matches on both, and the prerelease
      # identity stays where semantic-release actually reads it: the git tag and
      # npm's beta dist-tag.
      - name: Record the released version
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force --quiet

          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1)
          if [ -z "$tag" ]; then
            echo "::notice::No release tag on HEAD, so nothing was released and there is no version to record."
            exit 0
          fi

          npm version "${tag#v}" --no-git-tag-version --allow-same-version

          if git diff --quiet -- package.json package-lock.json; then
            echo "::notice::package.json already records ${tag#v}."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The checkout above sets persist-credentials: false, so the remote
          # carries no token and has to be given one to push with.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # [skip ci] because this commit cannot produce a release: a chore is
          # not a releasable type, so re-triggering would spend a full run --
          # including the CodeQL wait -- to publish nothing.
          git add package.json package-lock.json
          git commit -m "chore(release): record the published ${tag#v} [skip ci]"

          # A pull request rather than a push: main requires one, and requires
          # CodeQL results that a just-created commit cannot have. That is the
          # same wall @semantic-release/git hits, so going around it by pushing
          # would only reproduce the failure this replaced.
          branch="chore/record-${tag#v}"
          git checkout -b "$branch"
          git push -u origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(release): record the published ${tag#v}" \
            --body "Records the version published by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) in package.json and package-lock.json. Only the two version fields change.

          Merging this is what carries the version on to beta: the next push to main brings the branches level again."

      # Keeps beta level with main.
      #
      # Runs on every push to main rather than only the ones that publish, and
      # that is the point: the version lands through a pull request, so the
      # commit carrying it arrives on a later push than the release itself. A
      # step that only fired on releases would forever leave beta one commit
      # short of the number it is supposed to match.
      #
      # Merges GITHUB_SHA specifically, not whatever HEAD happens to be -- the
      # step above may have left HEAD on the chore branch, and that commit is
      # not on main yet.
      #
      # A conflict is left alone. beta carrying work main has not seen is the
      # normal state, and resolving that blind risks discarding it; a warning
      # asks for hands instead.
      - name: Bring beta level with main
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "::notice::No beta branch to sync."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin beta --quiet
          git checkout -B beta origin/beta

          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::notice::beta already contains $GITHUB_SHA."
            exit 0
          fi

          # --no-ff is load-bearing, not tidiness. The [skip ci] that stops this
          # push starting another release lives in the merge commit's message,
          # and a fast-forward creates no commit to carry it -- beta's new head
          # would just be main's commit, and its message decides whether the
          # workflows run. Fast-forward is the common case right after a
          # promotion, which is exactly when beta has nothing main lacks.
          if git merge --no-ff --no-edit "$GITHUB_SHA" -m "chore: merge main into beta [skip ci]"; then
            git push origin beta
            echo "beta brought level with main at ${GITHUB_SHA:0:7}."
          else
            git merge --abort
            echo "::warning::main does not merge cleanly into beta - merge it by hand."
          fi
