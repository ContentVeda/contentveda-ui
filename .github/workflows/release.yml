name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate on the suite before anything is published. semantic-release runs
  # prepublishOnly, which only builds — so without this a commit that compiles
  # but fails its tests goes to npm, and npm versions cannot be taken back.
  #
  # This duplicates what playwright.yml already runs on the same push, and that
  # is deliberate: that workflow is a separate run with no ordering relationship
  # to this one, so depending on it would mean publishing while it is still
  # going. A job in this workflow is the only thing `needs` can actually wait
  # for.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library and generate docs pages
        run: npm run build

      - name: Run BDD suite
        run: npm run test:bdd

  release:
    needs: verify
    runs-on: ubuntu-latest
    # Scopes the OIDC token's environment claim to "release", matching the
    # Trusted Publisher configured on npmjs.com for this package — npm checks
    # that claim, so the environment name must match exactly (and the
    # environment itself must exist under repo Settings -> Environments).
    environment: release
    permissions:
      contents: write      # semantic-release commits CHANGELOG/package.json bump + creates the git tag
      issues: write        # @semantic-release/github comments on referenced issues/PRs
      pull-requests: write
      id-token: write      # OIDC for npm trusted publishing (also covers provenance)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history to analyze commits since the last tag
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No NPM_TOKEN/NODE_AUTH_TOKEN needed anymore — @semantic-release/npm
      # (v13.1.5+) detects the GitHub Actions OIDC context automatically and
      # exchanges it for a short-lived publish credential via npm's Trusted
      # Publisher flow, which also generates provenance attestations without
      # needing NPM_CONFIG_PROVENANCE explicitly set.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap credential for the FIRST publish, and expected to be
          # temporary.
          #
          # Trusted publishing is configured per package, on that package's own
          # settings page — which cannot exist for a name that has never been
          # published. So on a virgin package there is no trusted publisher for
          # the OIDC token to match, npm rejects the exchange, and
          # @semantic-release/npm fails in verifyConditions: before a version is
          # computed, which is why the earlier runs produced no tag, no release
          # and not even a failure issue.
          #
          # Once 1.0.0 exists on the registry, configure the Trusted Publisher
          # at npmjs.com (repository ContentVeda/contentveda-ui, workflow
          # release.yml, environment release), then delete this line and the
          # NPM_TOKEN secret — OIDC takes over from the next release.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Keep provenance attestations even while publishing with a token.
          # id-token: write is already granted above, and the repo is public,
          # which is all npm needs to sign the build.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
