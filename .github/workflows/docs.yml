name: Deploy Docs to GitHub Pages

# Chained after Release rather than run alongside it. The Pages mirror is
# generated from package.json's version, so deploying it in parallel with the
# release published docs named after the version the release was about to
# replace. Release succeeds even when it has nothing to publish, so ordinary
# pushes still refresh Pages.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires for failed runs too, so a broken release must not go on
    # to publish a Pages site built from it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a workflow_run trigger the default checkout is this repo's
          # default branch, not the branch whose release triggered the run. With
          # releases coming from both main and beta that silently does the wrong
          # thing: a beta release would rebuild and republish main's docs, so
          # the site would never show beta and the deploy would be pure churn.
          # Pin to the commit the release actually ran on. workflow_dispatch
          # carries no workflow_run context, hence the fallback.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library and generate docs pages
        run: npm run build

      # Runs even if scenarios fail -- the Allure report's whole purpose is
      # showing pass/fail history, so a regression should still deploy a
      # report that shows it, not silently skip generating one.
      - name: Run BDD suite (Allure results)
        run: npm run test:bdd
        continue-on-error: true

      - name: Generate Allure report
        run: npm run report:allure

      # enablement: true because this repo has no Pages site yet -- GET
      # /repos/:owner/:repo/pages returns 404, which is what this step failed on
      # ("Get Pages site failed... verify that the repository has Pages enabled
      # and configured to build using GitHub Actions"). With it, the action
      # creates the site and sets its build type to Actions on the first run,
      # using the pages: write permission granted above, instead of needing
      # someone to click through Settings -> Pages first.
      #
      # It stays useful after that first run: it is idempotent on an existing
      # site, so a repo restored from scratch or a fork does not hit the same
      # wall.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Propagating these pages to docs.contentveda.com is sync-docs.yml's job:
      # it pushes the generated tree into contentveda-docs as a commit, which is
      # what triggers that repo's validate-and-deploy run.
      #
      # Note the Allure report generated above is gitignored and so is never
      # part of that sync — it stays exclusive to this repo's Pages site.
