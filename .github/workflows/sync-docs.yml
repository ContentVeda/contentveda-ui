name: Sync docs to contentveda-docs

# Publishes this repo's generated component docs into contentveda-docs, which
# serves them at docs.contentveda.com/ui/.
#
# This is a push, not a pull: the docs site commits the tree rather than
# fetching it at build time. Two reasons.
#   1. The commit landing there is what triggers that repo's own
#      validate-and-deploy run. A dispatch event cannot do that when the host
#      deploys straight from git.
#   2. A clone of contentveda-docs is then a complete, buildable site, and every
#      change to the published component docs is reviewable as a diff.

on:
  push:
    branches: [main]
    # Only the inputs that can change the generated output. Skips the sync for
    # README edits, workflow tweaks and the like.
    paths:
      - 'src/**'
      - 'scripts/generate-docs.js'
      - 'docs/css/**'
      - 'docs/js/**'
      - 'docs/assets/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout component library
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Regenerate rather than trusting the committed docs/, so the sync can
      # never publish a tree that is stale relative to src/.
      - name: Build library and regenerate docs
        run: npm run build

      - name: Verify generated docs
        run: |
          # The docs tree is named after the package's major version, so read it
          # from package.json rather than hardcoding it here — otherwise this
          # check silently passes against a stale tree the moment the major
          # changes.
          major="v$(node -p "require('./package.json').version.split('.')[0]")"
          echo "Checking docs/$major"
          test -f "docs/$major/index.html" || { echo "::error::docs/$major/index.html missing"; exit 1; }
          pages=$(ls "docs/$major"/components/*.html 2>/dev/null | wc -l)
          test "$pages" -gt 0 || { echo "::error::no component pages generated"; exit 1; }
          # Every page loads ../dist/webcomponent/dist/index.js for its live
          # playground. Publishing without it means ten pages of dead demos.
          test -f "docs/$major/dist/webcomponent/dist/index.js" \
            || { echo "::error::playground bundles missing from docs/$major/dist"; exit 1; }
          echo "$pages component pages, $(find docs -type f | wc -l) files total."

      - name: Checkout docs site
        uses: actions/checkout@v4
        with:
          repository: nilkoushik/contentveda-docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: .docs-site
          # Full history would be pointless here; we only ever add one commit.
          fetch-depth: 1

      - name: Replace the component docs section
        run: |
          dest=.docs-site/static/ui
          # Delete first: a plain copy would leave behind pages for components
          # that have since been renamed or removed.
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r docs/. "$dest/"
          echo "Staged $(find "$dest" -type f | wc -l) files into static/ui/."

      - name: Commit and push
        working-directory: .docs-site
        run: |
          git config user.name  "contentveda-ui[bot]"
          git config user.email "noreply@contentveda.com"
          git add static/ui

          if git diff --cached --quiet; then
            echo "Component docs are unchanged — nothing to sync."
            exit 0
          fi

          files=$(git diff --cached --name-only | wc -l)
          git commit -m "docs(ui): sync component docs from contentveda-ui@${GITHUB_SHA:0:7}

          ${files} file(s) changed. Generated by ${GITHUB_REPOSITORY}
          run ${GITHUB_RUN_ID}; do not edit static/ui/ by hand — the next sync
          overwrites it.

          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          git push
          echo "Pushed ${files} changed file(s). contentveda-docs will now validate and deploy."
